name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project NexusAI.xcodeproj \
            -scheme NexusAI \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/DD \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/DD/Build/Products/Release-iphoneos/NexusAI.app Payload/
          zip -qry NexusAI.ipa Payload
          ls -lh NexusAI.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexusAI-ipa
          path: NexusAI.ipa
