name: NexusAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  NexusAI:
    type: application
    platform: iOS
    sources:
      - path: NexusAI
        excludes:
          - WebApp
          - WebApp/**
      - path: NexusAI/WebApp
        type: folder
    info:
      path: NexusAI/Info.plist
      properties:
        CFBundleDisplayName: NexusAI
        UILaunchScreen: {}
        NSCalendarsUsageDescription: "NexusAI 需要访问日历，以便编队读取和安排你的日程。"
        NSRemindersUsageDescription: "NexusAI 需要访问提醒事项，以便编队查看和创建提醒。"
        NSCalendarsFullAccessUsageDescription: "NexusAI 需要访问日历，以便编队读取和安排你的日程。"
        NSRemindersFullAccessUsageDescription: "NexusAI 需要访问提醒事项，以便编队查看和创建提醒。"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.nexusai
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "6"
